<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/src/styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>miraie</title>
  <script type="module" src="/src/main.ts" defer></script>
</head>

<body>
  <main class="container">

    <!-- Settings Button -->
    <button id="settings-btn" aria-label="Settings" class="icon-btn top-right">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
        </path>
      </svg>
    </button>

    <!-- ═══════════════ MAIN VIEW ═══════════════ -->
    <div id="main-view" class="view">

      <!-- Header: Device name + power toggle -->
      <div class="header-row">
        <div class="device-info">
          <span class="device-label">Living Room AC</span>
        </div>
        <button id="power-btn" class="power-button" aria-label="Power" title="Toggle Power">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
        </button>
      </div>

      <!-- Temperature display + adjuster -->
      <div class="temp-display-card">
        <div class="temp-ambient">
          <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z" />
          </svg>
          <span id="room-temp-label">—°C</span>
        </div>
        <div class="temp-controls">
          <button class="temp-btn" id="temp-down" aria-label="Decrease temperature">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none">
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </button>
          <div class="temp-value-wrap">
            <span id="temp-value">24</span>
            <span class="temp-unit">°C</span>
          </div>
          <button class="temp-btn" id="temp-up" aria-label="Increase temperature">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </button>
        </div>
        <span class="temp-set-label">Set Temperature</span>
      </div>

      <!-- HVAC Mode Tabs -->
      <div class="control-section">
        <label class="section-label">Mode</label>
        <div class="mode-pills" id="hvac-mode-pills">
          <button class="mode-pill" data-value="cool">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M19.07 4.93L4.93 19.07" />
            </svg>
            Cool
          </button>
          <button class="mode-pill" data-value="heat">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M12 2a10 10 0 1 0 10 10" />
              <path d="M12 8v4l3 3" />
            </svg>
            Heat
          </button>
          <button class="mode-pill" data-value="dry">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
            </svg>
            Dry
          </button>
          <button class="mode-pill" data-value="fan">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0" />
              <path d="M12 12c0-3.87 1.93-7 5-9" />
              <path d="M12 12c3.87 0 7-1.93 9-5" />
              <path d="M12 12c0 3.87-1.93 7-5 9" />
              <path d="M12 12c-3.87 0-7 1.93-9 5" />
            </svg>
            Fan
          </button>
          <button class="mode-pill" data-value="auto">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 8v4l3 3" />
            </svg>
            Auto
          </button>
        </div>
      </div>

      <!-- Fan Speed -->
      <div class="control-section">
        <label class="section-label">Fan Speed</label>
        <div class="mode-pills" id="fan-mode-pills">
          <button class="mode-pill" data-value="quiet">Quiet</button>
          <button class="mode-pill" data-value="low">Low</button>
          <button class="mode-pill" data-value="medium">Med</button>
          <button class="mode-pill" data-value="high">High</button>
          <button class="mode-pill" data-value="auto">Auto</button>
        </div>
      </div>

      <!-- Preset Mode -->
      <div class="control-section">
        <label class="section-label">Preset</label>
        <div class="mode-pills" id="preset-mode-pills">
          <button class="mode-pill" data-value="none">Normal</button>
          <button class="mode-pill" data-value="eco">Eco</button>
          <button class="mode-pill" data-value="boost">Boost</button>
          <button class="mode-pill" data-value="clean">Clean</button>
        </div>
      </div>

      <!-- Swing Controls -->
      <div class="swing-row">
        <div class="control-section swing-section">
          <label class="section-label">V-Swing</label>
          <div class="swing-pills" id="v-swing-pills">
            <button class="swing-pill" data-value="0" title="Auto">A</button>
            <button class="swing-pill" data-value="1" title="Pos 1">1</button>
            <button class="swing-pill" data-value="2" title="Pos 2">2</button>
            <button class="swing-pill" data-value="3" title="Pos 3">3</button>
            <button class="swing-pill" data-value="4" title="Pos 4">4</button>
            <button class="swing-pill" data-value="5" title="Pos 5">5</button>
          </div>
        </div>
        <div class="control-section swing-section">
          <label class="section-label">H-Swing</label>
          <div class="swing-pills" id="h-swing-pills">
            <button class="swing-pill" data-value="0" title="Auto">A</button>
            <button class="swing-pill" data-value="1" title="Pos 1">1</button>
            <button class="swing-pill" data-value="2" title="Pos 2">2</button>
            <button class="swing-pill" data-value="3" title="Pos 3">3</button>
            <button class="swing-pill" data-value="4" title="Pos 4">4</button>
            <button class="swing-pill" data-value="5" title="Pos 5">5</button>
          </div>
        </div>
      </div>

      <!-- Converti7 Mode -->
      <div class="control-section">
        <label class="section-label">Converti7</label>
        <div class="mode-pills" id="converti-mode-pills">
          <button class="mode-pill" data-value="0">Off</button>
          <button class="mode-pill" data-value="40">40%</button>
          <button class="mode-pill" data-value="55">55%</button>
          <button class="mode-pill" data-value="70">70%</button>
          <button class="mode-pill" data-value="80">80%</button>
          <button class="mode-pill" data-value="90">90%</button>
          <button class="mode-pill" data-value="100">FC</button>
          <button class="mode-pill" data-value="110">HC</button>
        </div>
      </div>

      <!-- Display toggle -->

      <div class="toggle-row">
        <span class="toggle-label">Display Light</span>
        <label class="toggle-switch">
          <input type="checkbox" id="display-toggle" />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- Status bar -->
      <div id="status" class="status-bar"></div>

    </div><!-- /main-view -->

    <!-- ═══════════════ SETTINGS VIEW ═══════════════ -->
    <div id="settings-view" class="view hidden">
      <button id="back-btn" aria-label="Back" class="icon-btn top-left">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h2 class="settings-title">Settings</h2>
      <div class="input-group">
        <label class="input-label" for="mobile-input">Mobile Number</label>
        <input type="text" id="mobile-input" placeholder="+91 9876543210" autocomplete="off" />
        <label class="input-label" for="password-input">Password</label>
        <input type="password" id="password-input" placeholder="••••••••" />
        <button id="save-settings-btn">Save &amp; Connect</button>
      </div>
    </div><!-- /settings-view -->

  </main>
</body>

</html>
